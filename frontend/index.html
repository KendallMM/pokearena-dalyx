<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>PokéArena · Administración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Jost:wght@400;500;600;700;800&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem("pokearena-modo") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // Con el almacenamiento bloqueado se queda el modo claro.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
